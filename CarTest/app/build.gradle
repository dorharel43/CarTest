plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dor.cartest'
    compileSdk 34

    defaultConfig {
        applicationId "com.dor.cartest"
        // The car unit runs Android 5.1 (API 22), so we support from API 21
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
